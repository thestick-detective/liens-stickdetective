<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Stick Detective | Liens Officiels</title>
    
    <!-- Google Fonts: Quicksand pour un look arrondi, propre et ludique -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS pour le layout responsive et le styling de base -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuration Tailwind pour les couleurs sur mesure -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mystery: {
                            900: '#0b132b', // Fond principal très sombre
                            800: '#1c2541', // Fond secondaire pour les boutons
                            700: '#3a506b', // Bordures
                        },
                        gold: {
                            DEFAULT: '#ffc107', // Jaune détective
                            hover: '#ffca28',
                        },
                        cyan: {
                            DEFAULT: '#00f0ff', // Bleu cyan lumineux du logo
                            400: '#22d3ee',
                        }
                    },
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS personnalisé pour des animations avancées et détails */
        body {
            background-color: #0b132b;
            background-image: radial-gradient(circle at 50% 0%, #1c2541 0%, #0b132b 70%);
            color: white;
            font-family: 'Quicksand', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Animation d'apparition en cascade pour les boutons */
        .fade-in-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s ease-out forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Délais en cascade pour chaque bouton */
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        .delay-5 { animation-delay: 0.5s; }

        /* Effet de lueur sur le profil (Cyan) */
        .profile-glow {
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.4);
            transition: box-shadow 0.3s ease;
        }
        .profile-glow:hover {
            box-shadow: 0 0 40px rgba(34, 211, 238, 0.8);
        }

        /* Animation au survol de l'icône dans les boutons */
        .link-btn:hover .btn-icon {
            transform: scale(1.2) rotate(5deg);
        }
        
        .btn-icon {
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-12 px-5 sm:px-10">

    <!-- Section En-tête / Profil -->
    <header class="flex flex-col items-center mb-10 w-full max-w-md">
        <!-- Photo de profil avec contour lumineux cyan -->
        <div class="w-32 h-32 rounded-full bg-mystery-800 border-4 border-cyan-400 flex items-center justify-center profile-glow mb-4 z-10 relative overflow-hidden">
            <img src="18351.jpg" alt="The Stick Detective" class="w-full h-full object-cover">
        </div>
        
        <h1 class="text-3xl font-bold text-white mb-2 text-center tracking-wide">@the.stick.detective</h1>
        <p class="text-cyan-400 font-medium text-center text-sm px-4">
            <i class="fa-solid fa-shoe-prints mr-2 text-xs opacity-80"></i> 
            Mener l'enquête sur tous les réseaux !
        </p>
    </header>

    <!-- Section Liens -->
    <main class="w-full max-w-md flex flex-col gap-4">
        
        <!-- TikTok -->
        <a href="https://tiktok.com/@the.stick.detective" target="_blank" rel="noopener noreferrer" 
           class="link-btn fade-in-up delay-1 relative group flex items-center w-full p-4 rounded-full bg-mystery-800 border border-mystery-700 hover:border-cyan-400 transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_8px_20px_rgba(34,211,238,0.25)] overflow-hidden">
            <div class="absolute left-6 btn-icon flex items-center justify-center w-8 h-8 rounded-full bg-black/30">
                <i class="fa-brands fa-tiktok text-white text-xl group-hover:text-cyan-400 transition-colors"></i>
            </div>
            <span class="w-full text-center text-lg font-semibold text-white group-hover:text-cyan-400 transition-colors">TikTok</span>
        </a>

        <!-- Instagram -->
        <a href="https://www.instagram.com/thestickdetective" target="_blank" rel="noopener noreferrer" 
           class="link-btn fade-in-up delay-2 relative group flex items-center w-full p-4 rounded-full bg-mystery-800 border border-mystery-700 hover:border-cyan-400 transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_8px_20px_rgba(34,211,238,0.25)] overflow-hidden">
            <div class="absolute left-6 btn-icon flex items-center justify-center w-8 h-8 rounded-full bg-black/30">
                <i class="fa-brands fa-instagram text-white text-xl group-hover:text-cyan-400 transition-colors"></i>
            </div>
            <span class="w-full text-center text-lg font-semibold text-white group-hover:text-cyan-400 transition-colors">Instagram</span>
        </a>

        <!-- YouTube -->
        <a href="https://www.youtube.com/@TheStickDetective-d1o" target="_blank" rel="noopener noreferrer" 
           class="link-btn fade-in-up delay-3 relative group flex items-center w-full p-4 rounded-full bg-mystery-800 border border-mystery-700 hover:border-cyan-400 transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_8px_20px_rgba(34,211,238,0.25)] overflow-hidden">
            <div class="absolute left-6 btn-icon flex items-center justify-center w-8 h-8 rounded-full bg-black/30">
                <i class="fa-brands fa-youtube text-white text-xl group-hover:text-cyan-400 transition-colors"></i>
            </div>
            <span class="w-full text-center text-lg font-semibold text-white group-hover:text-cyan-400 transition-colors">YouTube</span>
        </a>

        <!-- Facebook -->
        <a href="https://www.facebook.com/share/1DMvxD3AKa/" target="_blank" rel="noopener noreferrer" 
           class="link-btn fade-in-up delay-4 relative group flex items-center w-full p-4 rounded-full bg-mystery-800 border border-mystery-700 hover:border-cyan-400 transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_8px_20px_rgba(34,211,238,0.25)] overflow-hidden">
            <div class="absolute left-6 btn-icon flex items-center justify-center w-8 h-8 rounded-full bg-black/30">
                <i class="fa-brands fa-facebook-f text-white text-xl group-hover:text-cyan-400 transition-colors"></i>
            </div>
            <span class="w-full text-center text-lg font-semibold text-white group-hover:text-cyan-400 transition-colors">Facebook</span>
        </a>

        <!-- Espace pour le futur -->
        <div class="w-full flex items-center justify-center mt-4 mb-2 fade-in-up delay-5">
            <div class="h-px bg-mystery-700 flex-1"></div>
            <span class="px-4 text-mystery-700 text-sm font-semibold uppercase tracking-wider">Top Secret</span>
            <div class="h-px bg-mystery-700 flex-1"></div>
        </div>

        <!-- Shop (Coming Soon) en Or -->
        <div class="link-btn fade-in-up delay-5 relative flex items-center w-full p-4 rounded-full bg-mystery-800 border border-gold hover:shadow-[0_8px_20px_rgba(255,193,7,0.3)] transition-all duration-300 hover:-translate-y-1 overflow-hidden group">
            <div class="absolute left-6 flex items-center justify-center w-8 h-8 rounded-full bg-black/30">
                <i class="fa-solid fa-lock text-gold text-lg btn-icon"></i>
            </div>
            <div class="w-full text-center flex flex-col">
                <span class="text-lg font-bold text-gold leading-tight group-hover:text-yellow-300 transition-colors">Boutique Officielle</span>
                <span class="text-xs font-semibold text-gold/70 tracking-widest uppercase">Ouverture Bientôt</span>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="mt-auto pt-12 fade-in-up delay-5">
        <p class="text-mystery-700 text-sm">
            © 2026 The Stick Detective
        </p>
    </footer>

</body>
</html>
